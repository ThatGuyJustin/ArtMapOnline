http:
  routers:
    backend:
      rule: "Path(`/api`) || PathPrefix(`/api/`)"
      entryPoints:
        - web
      priority: 100
      service: backend
    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      priority: 1
      service: frontend
  services:
    backend:
      loadBalancer:
        servers:
          - url: http://backend:8000
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8001
